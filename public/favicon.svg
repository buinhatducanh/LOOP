<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0C14"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B3DF5"/>
      <stop offset="50%" stop-color="#4F7DF3"/>
      <stop offset="100%" stop-color="#CC3344"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="logoClip">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Glow ring -->
  <rect width="64" height="64" rx="14" fill="url(#logoGrad)" opacity="0.3" filter="url(#glow)"/>

  <!-- Infinity logo centered, scaled to ~38x38 -->
  <g transform="translate(32,32) scale(0.59)" filter="url(#glow)">
    <path
      d="M16,0 C16,0 22,0 22,8 C22,16 10,16 10,24 C10,32 22,32 22,40 C22,48 16,48 16,48 L-16,48 C-16,48 -22,48 -22,40 C-22,32 -10,32 -10,24 C-10,16 -22,16 -22,8 C-22,0 -16,0 -16,0 Z"
      fill="none"
      stroke="url(#logoGrad)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center diamond -->
    <circle cx="0" cy="24" r="3.5" fill="url(#logoGrad)"/>
    <!-- Glow dot left -->
    <circle cx="-10" cy="8" r="2.5" fill="#6B3DF5" opacity="0.8"/>
    <!-- Glow dot right -->
    <circle cx="10" cy="40" r="2.5" fill="#CC3344" opacity="0.8"/>
  </g>
</svg>
