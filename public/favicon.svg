<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#06B6D4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Top accent line -->
  <rect x="14" y="12" width="36" height="2" rx="1" fill="url(#textGrad)" opacity="0.7"/>

  <!-- "LOOP" text -->
  <text
    x="32" y="46"
    font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
    font-size="26"
    font-weight="800"
    text-anchor="middle"
    fill="url(#textGrad)"
    filter="url(#textShadow)"
    letter-spacing="-1"
  >LOOP</text>

  <!-- Bottom accent line -->
  <rect x="14" y="50" width="36" height="2" rx="1" fill="url(#textGrad)" opacity="0.7"/>
</svg>
