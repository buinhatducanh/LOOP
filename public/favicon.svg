<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B3DF5"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="sym" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B3DF5"/>
      <stop offset="40%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#4F7DF3"/>
    </linearGradient>
  </defs>

  <!-- Bold hexagon background -->
  <polygon
    points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5"
    fill="url(#bg)"
  />

  <!-- Bold infinity symbol — thick strokes, centered -->
  <!-- Left loop -->
  <path
    d="M32 32 C24 20, 10 20, 10 32 C10 44, 24 44, 32 32"
    fill="none"
    stroke="white"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <!-- Right loop -->
  <path
    d="M32 32 C40 44, 54 44, 54 32 C54 20, 40 20, 32 32"
    fill="none"
    stroke="white"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <!-- Center cross join -->
  <line x1="28" y1="28" x2="36" y2="36" stroke="white" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Pink sparkle dots for cosmic feel -->
  <circle cx="12" cy="20" r="2" fill="#EC4899" opacity="0.8"/>
  <circle cx="52" cy="44" r="2" fill="#4F7DF3" opacity="0.8"/>
</svg>