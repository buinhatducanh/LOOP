name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.filter.outputs.be }}
      fe: ${{ steps.filter.outputs.fe }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            be:
              - 'src/**'
              - 'prisma/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'tests/**'
              - '.github/workflows/**'
            fe:
              - 'FE/**'

  be-lint-typecheck:
    name: BE Lint & Type Check
    needs: changes
    if: needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

  be-test:
    name: BE Unit Tests
    needs: changes
    if: needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run
        env:
          UPSTASH_REDIS_REST_URL: ''
          UPSTASH_REDIS_REST_TOKEN: ''
          INNGEST_SIGNING_KEY: ''
          INNGEST_EVENT_KEY: ''
          SENTRY_DSN: ''

  be-scale-gate:
    name: BE Scale Gates
    needs: [changes, be-lint-typecheck]
    if: needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Scale Gates
        run: npx tsx scripts/run-scale-gates.ts

  be-build:
    name: BE Production Build
    needs: [changes, be-lint-typecheck, be-test, be-scale-gate]
    if: needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build Next.js app
        run: npx tsc --noEmit && npm run build:ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loop_ci
          AUTH_SECRET: ci_dummy_secret_please_override
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SANITY_PROJECT_ID: dummy
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: 2024-01-01
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-XXXXXXX
          NEXT_PUBLIC_TAWKTO_PROPERTY_ID: dummy
          NEXT_PUBLIC_TAWKTO_WIDGET_ID: dummy
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: dummy
          CLOUDINARY_API_SECRET: dummy
          UPSTASH_REDIS_REST_URL: ''
          UPSTASH_REDIS_REST_TOKEN: ''
          INNGEST_SIGNING_KEY: ''
          INNGEST_EVENT_KEY: ''
          SENTRY_DSN: ''

  fe-build:
    name: FE Build (Vite)
    needs: changes
    if: needs.changes.outputs.fe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: FE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build FE app
        run: npm run build

  be-e2e:
    name: BE E2E Tests
    needs: [be-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: npm run dev &
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL: https://loops.vn
          NEXT_PUBLIC_SITE_URL: https://loops.vn

      - name: Wait for dev server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  ci-summary:
    name: CI Summary
    needs: [changes, be-lint-typecheck, be-test, be-scale-gate, be-build, fe-build, be-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "Changed BE: ${{ needs.changes.outputs.be }}"
          echo "Changed FE: ${{ needs.changes.outputs.fe }}"
          echo "BE lint/typecheck: ${{ needs.be-lint-typecheck.result || 'skipped' }}"
          echo "BE scale gates: ${{ needs.be-scale-gate.result || 'skipped' }}"
          echo "BE unit tests: ${{ needs.be-test.result || 'skipped' }}"
          echo "BE build: ${{ needs.be-build.result || 'skipped' }}"
          echo "BE E2E tests: ${{ needs.be-e2e.result || 'skipped' }}"
          echo "FE build: ${{ needs.fe-build.result || 'skipped' }}"

      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.be-lint-typecheck.result }}" = "failure" ] || [ "${{ needs.be-scale-gate.result }}" = "failure" ] || [ "${{ needs.be-test.result }}" = "failure" ] || [ "${{ needs.be-build.result }}" = "failure" ] || [ "${{ needs.be-e2e.result }}" = "failure" ] || [ "${{ needs.fe-build.result }}" = "failure" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
